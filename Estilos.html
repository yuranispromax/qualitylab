<style>
:root{--azul:#006081;--tinta:#03222E;--tinta2:#0A3445;--verde:#39A835;--amarillo:#FFD417;--naranja:#FF7A3D;--violeta:#8E7CC3;
--fondo:#F2F7F9;--papel:#FFFFFF;--texto:#12303B;--suave:#4F6B76;--linea:#D6E3E8;
--display:"VW Serial","Fredoka","Nunito Sans",system-ui,sans-serif;--cuerpo:"Nunito Sans",system-ui,-apple-system,Segoe UI,sans-serif;--mono:"JetBrains Mono",ui-monospace,Menlo,monospace;color-scheme:light}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{background:var(--fondo);color:var(--texto);font-family:var(--cuerpo);font-size:16px;line-height:1.6}
.pg[hidden]{display:none!important}.lb[hidden]{display:none!important}
.topnav{position:sticky;top:0;z-index:50;background:rgba(3,34,46,.96);backdrop-filter:blur(6px);border-bottom:1px solid rgba(255,255,255,.08)}
.topnav .in{max-width:1180px;margin:0 auto;padding:10px clamp(16px,4vw,40px);display:flex;align-items:center;gap:18px}
.topnav img{height:30px;width:auto;display:block;cursor:pointer}
.topnav .links{display:flex;gap:4px;overflow-x:auto;scrollbar-width:none;margin-left:auto}
.topnav .links::-webkit-scrollbar{display:none}
.topnav a{white-space:nowrap;color:#C9DCE3;text-decoration:none;font:700 14px var(--cuerpo);padding:8px 12px;border-radius:999px;transition:background .2s,color .2s}
.topnav a:hover{background:rgba(255,255,255,.08);color:#fff}
.topnav a.act{background:var(--amarillo);color:var(--tinta)}
footer.inst{background:#fff;border-top:1px solid var(--linea)}
footer.inst .wrap{max-width:1180px;margin:0 auto;padding-inline:clamp(16px,4vw,40px);display:flex;flex-wrap:wrap;justify-content:space-between;align-items:center;gap:18px 32px;padding-block:26px}
footer.inst .grupo{display:flex;align-items:center;gap:18px;flex-wrap:nowrap}
footer.inst .grupo img{height:34px;width:auto;display:block}
footer.inst p{margin:0;font-size:12.5px;color:var(--suave);text-align:center;flex:1;min-width:180px}
footer.inst strong{color:var(--tinta)}
:focus-visible{outline:3px solid var(--amarillo);outline-offset:3px;border-radius:6px}
@media (max-width:640px){footer.inst .grupo img{height:28px}footer.inst p{text-align:left}.topnav img{height:24px}}

/* Inicio */
.pg-inicio *{box-sizing:border-box}
.pg-inicio{margin:0;background:var(--fondo);color:var(--texto);font-family:var(--cuerpo);font-size:16px;line-height:1.6}
.pg-inicio a{color:inherit}
.pg-inicio .wrap{max-width:1180px;margin:0 auto;padding-inline:clamp(16px,4vw,40px)}
.pg-inicio .eyebrow{font-family:var(--mono);font-size:12px;letter-spacing:.14em;text-transform:uppercase}
.pg-inicio h1,.pg-inicio h2,.pg-inicio h3{font-family:var(--display);text-wrap:balance;margin:0;line-height:1.1}
.pg-inicio h2{font-size:clamp(28px,4vw,42px);font-weight:700;color:var(--tinta)}
.pg-inicio :focus-visible{outline:3px solid var(--amarillo);outline-offset:3px;border-radius:6px}
.pg-inicio .hero{position:relative;background:radial-gradient(120% 90% at 78% 10%,#0B4A61 0%,var(--tinta) 58%);color:#fff;overflow:hidden}
.pg-inicio #burbujas{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
.pg-inicio .hero .wrap{position:relative;display:grid;grid-template-columns:1fr 1fr;gap:48px;align-items:center;padding-block:64px 72px}
.pg-inicio .hero img.logo{width:min(560px,100%);height:auto;display:block;margin-bottom:28px}
.pg-inicio .hero .lema{font-family:var(--display);font-weight:600;font-size:clamp(22px,2.6vw,30px);line-height:1.25;max-width:22ch;margin:0 0 18px}
.pg-inicio .hero .lema em{font-style:normal;color:var(--amarillo)}
.pg-inicio .hero p.intro{color:#C9DCE3;max-width:56ch;margin:0 0 28px}
.pg-inicio .acciones{display:flex;flex-wrap:wrap;gap:12px}
.pg-inicio .btn{display:inline-flex;align-items:center;gap:10px;font-weight:800;text-decoration:none;padding:12px 20px;border-radius:999px;font-size:15px;transition:transform .2s}
.pg-inicio .btn:hover{transform:translateY(-2px)}
.pg-inicio .btn.primario{background:var(--verde);color:#fff}
.pg-inicio .btn.fantasma{border:1.5px solid #5E8FA1;color:#fff}
.pg-inicio .ficha{background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.14);border-radius:18px;padding:24px;backdrop-filter:blur(4px)}
.pg-inicio .ficha .eyebrow{color:var(--amarillo)}
.pg-inicio .ficha dl{margin:14px 0 0;display:grid;gap:14px}
.pg-inicio .ficha dt{font-family:var(--mono);font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:#8FB3C0}
.pg-inicio .ficha dd{margin:2px 0 0;font-weight:600;color:#fff}
.pg-inicio .ficha .hito{display:flex;gap:14px;align-items:baseline;border-top:1px dashed rgba(255,255,255,.16);padding-top:12px}
.pg-inicio .ficha .hito b{font-family:var(--mono);color:var(--amarillo);font-weight:500;min-width:44px}
.pg-inicio .seccion{padding-block:72px}
.pg-inicio .cab{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:end;gap:16px 40px;margin-bottom:32px}
.pg-inicio .cab p{max-width:52ch;margin:0;color:var(--suave)}
.pg-inicio .cab .eyebrow{color:var(--azul);display:block;margin-bottom:10px}
.pg-inicio .tabla{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}
.pg-inicio .el{position:relative;display:flex;flex-direction:column;gap:6px;min-height:188px;padding:18px 20px;border-radius:16px;background:var(--papel);border:1.5px solid var(--linea);text-decoration:none;transition:transform .25s,box-shadow .25s,border-color .25s;overflow:hidden}
.pg-inicio .el::after{content:"";position:absolute;left:0;right:0;bottom:0;height:0;background:var(--c);opacity:.10;transition:height .35s ease}
.pg-inicio .el:hover{transform:translateY(-4px);box-shadow:0 14px 30px -18px rgba(3,34,46,.45);border-color:var(--c)}
.pg-inicio .el:hover::after{height:100%}
.pg-inicio .el .num{font-family:var(--mono);font-size:12px;color:var(--suave);display:flex;justify-content:space-between}
.pg-inicio .el .sim{font-family:var(--display);font-weight:700;font-size:52px;line-height:1;color:var(--c)}
.pg-inicio .el .nom{font-weight:800;font-size:17px;color:var(--tinta)}
.pg-inicio .el .des{font-size:14px;color:var(--suave);line-height:1.45}
.pg-inicio .el.destacado{background:var(--tinta);border-color:var(--tinta)}
.pg-inicio .el.destacado .nom{color:#fff}
.pg-inicio .el.destacado .des,.pg-inicio .el.destacado .num{color:#A9C6D1}
.pg-inicio .leyenda{display:flex;flex-wrap:wrap;gap:10px 22px;margin-top:20px;font-size:13px;color:var(--suave)}
.pg-inicio .leyenda span{display:inline-flex;align-items:center;gap:8px}
.pg-inicio .leyenda i{width:12px;height:12px;border-radius:4px;background:var(--c)}
.pg-inicio .manifiesto{background:var(--papel);border-block:1px solid var(--linea)}
.pg-inicio .manifiesto .wrap{display:grid;grid-template-columns:.8fr 1.2fr;gap:48px;padding-block:72px}
.pg-inicio .manifiesto blockquote{margin:0;font-family:var(--display);font-weight:600;font-size:clamp(26px,3.4vw,38px);line-height:1.2;color:var(--azul)}
.pg-inicio .manifiesto blockquote span{color:var(--verde)}
.pg-inicio .manifiesto p{margin:0 0 16px;max-width:62ch}
.pg-inicio .cal{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:14px}
.pg-inicio .dia{display:grid;grid-template-columns:auto 1fr;gap:14px;align-items:start;background:var(--papel);border:1.5px solid var(--linea);border-radius:14px;padding:16px}
.pg-inicio .fecha{width:58px;text-align:center;border-radius:10px;background:var(--fondo);padding:6px 0;font-variant-numeric:tabular-nums}
.pg-inicio .fecha b{display:block;font-family:var(--display);font-size:26px;line-height:1;color:var(--tinta)}
.pg-inicio .fecha small{font-family:var(--mono);font-size:11px;text-transform:uppercase;color:var(--suave)}
.pg-inicio .dia h3{font-family:var(--cuerpo);font-size:15px;font-weight:800;color:var(--tinta);line-height:1.3}
.pg-inicio .dia .tag{display:inline-block;margin-top:6px;font-family:var(--mono);font-size:11px;padding:2px 8px;border-radius:999px;background:#FFF5C2;color:#6B5600}
.pg-inicio .dia.proximo{border-color:var(--verde);box-shadow:0 0 0 3px rgba(57,168,53,.15)}
.pg-inicio .dia.proximo .fecha{background:var(--verde)}
.pg-inicio .dia.proximo .fecha b,.pg-inicio .dia.proximo .fecha small{color:#fff}
.pg-inicio .nota{font-size:13px;color:var(--suave);margin-top:14px}
.pg-inicio .bitacora{display:grid;grid-template-columns:repeat(2,1fr);gap:14px}
.pg-inicio .entrada{background:var(--papel);border-radius:16px;padding:22px 24px;border:1.5px solid var(--linea);display:flex;flex-direction:column;gap:8px}
.pg-inicio .entrada .eyebrow{color:var(--c)}
.pg-inicio .entrada h3{font-size:21px;color:var(--tinta)}
.pg-inicio .entrada p{margin:0;color:var(--suave);font-size:15px}
.pg-inicio .instrumentos{background:var(--tinta);color:#fff}
.pg-inicio .instrumentos h2{color:#fff}
.pg-inicio .instrumentos .cab p{color:#A9C6D1}
.pg-inicio .instrumentos .cab .eyebrow{color:var(--amarillo)}
.pg-inicio .lista{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:10px}
.pg-inicio .inst{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:14px 16px;border-radius:12px;background:var(--tinta2);border:1px solid rgba(255,255,255,.08);text-decoration:none;transition:background .2s}
.pg-inicio a.inst:hover{background:#0F4A61}
.pg-inicio .inst b{font-weight:700;font-size:15px}
.pg-inicio .inst small{display:block;font-family:var(--mono);font-size:11px;color:#8FB3C0}
.pg-inicio .estado{flex:none;font-family:var(--mono);font-size:11px;padding:3px 9px;border-radius:999px}
.pg-inicio .estado.on{background:rgba(57,168,53,.2);color:#8BE087}
.pg-inicio .estado.off{background:rgba(255,255,255,.08);color:#A9C6D1}
.pg-inicio footer{background:var(--papel);border-top:1px solid var(--linea)}
.pg-inicio footer .wrap{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:center;gap:20px;padding-block:32px}
.pg-inicio footer img{width:220px;height:auto}
.pg-inicio footer p{margin:0;font-size:14px;color:var(--suave)}
.pg-inicio footer strong{color:var(--tinta)}
@media (max-width:900px){.pg-inicio .hero .wrap,.pg-inicio .manifiesto .wrap{grid-template-columns:1fr;gap:32px}.pg-inicio .tabla{grid-template-columns:repeat(2,1fr)}.pg-inicio .bitacora{grid-template-columns:1fr}}
@media (max-width:520px){.pg-inicio .tabla{grid-template-columns:1fr}.pg-inicio .el{min-height:0}}
@media (prefers-reduced-motion:reduce){.pg-inicio *{transition:none!important}.pg-inicio #burbujas{display:none}}
.pg-inicio footer.inst{background:#fff;border-top:1px solid var(--linea)}
.pg-inicio footer.inst .wrap{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:center;gap:18px 32px;padding-block:26px}
.pg-inicio footer.inst .grupo{display:flex;align-items:center;gap:18px;flex-wrap:nowrap}
.pg-inicio footer.inst .grupo img{height:34px;width:auto;display:block}
.pg-inicio footer.inst p{margin:0;font-size:12.5px;color:var(--suave);text-align:center;flex:1;min-width:180px}
.pg-inicio footer.inst strong{color:var(--tinta)}
.pg-inicio .aliados{display:flex;align-items:center;gap:18px}
.pg-inicio .aliados img{height:34px;width:auto;display:block}
.pg-inicio .mascota{display:block;height:auto;pointer-events:none;filter:drop-shadow(0 10px 18px rgba(0,0,0,.35))}
@media (max-width:640px){.pg-inicio .aliados img{height:26px}.pg-inicio footer.inst .grupo img{height:32px}.pg-inicio footer.inst p{text-align:left}}
.pg-inicio .aliados.top{margin-bottom:26px}
.pg-inicio .lado-hero{display:flex;align-items:flex-end;gap:12px;align-self:stretch}
.pg-inicio .lado-hero .ficha{flex:1;align-self:center}
.pg-inicio .calidoso{height:330px;width:auto;margin-bottom:-72px;flex:none}
@media (max-width:900px){.pg-inicio .calidoso{height:220px}}
@media (max-width:520px){.pg-inicio .calidoso{display:none}}
/* Planeacion */
.pg-planeacion *{box-sizing:border-box}
.pg-planeacion{margin:0;background:var(--fondo);color:var(--texto);font-family:var(--cuerpo);font-size:16px;line-height:1.6}
.pg-planeacion .wrap{max-width:1180px;margin:0 auto;padding-inline:clamp(16px,4vw,40px)}
.pg-planeacion .eyebrow{font-family:var(--mono);font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--azul)}
.pg-planeacion h1,.pg-planeacion h2,.pg-planeacion h3{font-family:var(--display);text-wrap:balance;margin:0;line-height:1.1}
.pg-planeacion h2{font-size:clamp(28px,4vw,42px);color:var(--tinta)}
.pg-planeacion .seccion{padding-block:72px}
.pg-planeacion .cab{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:end;gap:16px 40px;margin-bottom:32px}
.pg-planeacion .cab p{max-width:52ch;margin:0;color:var(--suave)}
.pg-planeacion .cab .eyebrow{display:block;margin-bottom:10px}
.pg-planeacion :focus-visible{outline:3px solid var(--amarillo);outline-offset:3px;border-radius:6px}
.pg-planeacion .hero{background:radial-gradient(120% 90% at 85% 0%,#0B4A61 0%,var(--tinta) 60%);color:#fff}
.pg-planeacion .hero .wrap{padding-block:56px 64px;display:grid;gap:28px}
.pg-planeacion .top{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:center;gap:16px}
.pg-planeacion .top img{width:220px;height:auto}
.pg-planeacion .codigo{font-family:var(--mono);font-size:12px;color:#8FB3C0;border:1px solid rgba(255,255,255,.18);border-radius:999px;padding:6px 14px}
.pg-planeacion .origen{max-width:900px}
.pg-planeacion .origen .eyebrow{color:var(--amarillo)}
.pg-planeacion .origen blockquote{margin:14px 0 18px;font-family:var(--display);font-weight:600;font-size:clamp(26px,3.4vw,40px);line-height:1.15}
.pg-planeacion .origen blockquote mark{background:none;color:var(--verde)}
.pg-planeacion .origen p{color:#C9DCE3;max-width:62ch;margin:0}
.pg-planeacion .proposito{background:var(--papel);border-bottom:1px solid var(--linea)}
.pg-planeacion .proposito .wrap{padding-block:64px;display:grid;grid-template-columns:.7fr 1.3fr;gap:40px;align-items:center}
.pg-planeacion .proposito q{font-family:var(--display);font-weight:700;font-size:clamp(30px,4.2vw,50px);line-height:1.1;color:var(--azul);quotes:"“" "”"}
.pg-planeacion .proposito .wrap.bloque2{display:block;padding-block:0 64px}
.pg-planeacion .mv{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-top:40px}
.pg-planeacion .mv article{background:var(--fondo);border-radius:16px;padding:24px}
.pg-planeacion .mv h3{font-size:22px;color:var(--tinta);margin-bottom:10px}
.pg-planeacion .mv p{margin:0;font-size:17px}
.pg-planeacion .megas{background:var(--tinta);color:#fff}
.pg-planeacion .megas h2{color:#fff}
.pg-planeacion .megas .cab p{color:#A9C6D1}
.pg-planeacion .megas .cab .eyebrow{color:var(--amarillo)}
.pg-planeacion .mega-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}
.pg-planeacion .mega{background:var(--tinta2);border-radius:18px;padding:28px;border:1px solid rgba(255,255,255,.08)}
.pg-planeacion .mega b{display:block;font-family:var(--display);font-size:clamp(56px,7vw,84px);line-height:1;color:var(--c);font-variant-numeric:tabular-nums}
.pg-planeacion .mega span{display:block;margin-top:10px;font-weight:800;font-size:18px}
.pg-planeacion .mega small{display:block;margin-top:6px;color:#8FB3C0;font-family:var(--mono);font-size:11px;letter-spacing:.1em;text-transform:uppercase}
.pg-planeacion .valores{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}
.pg-planeacion .valor{background:var(--papel);border:1.5px solid var(--linea);border-radius:18px;padding:26px;display:flex;flex-direction:column;gap:10px;border-top:6px solid var(--c)}
.pg-planeacion .valor h3{font-size:28px;color:var(--tinta)}
.pg-planeacion .valor .def{font-weight:700;color:var(--azul)}
.pg-planeacion .valor ul{margin:0;padding-left:18px;color:var(--suave);font-size:15px}
.pg-planeacion .valor li+li{margin-top:6px}
.pg-planeacion .ejes{display:flex;flex-wrap:wrap;gap:10px;margin-top:28px}
.pg-planeacion .ejes span{padding:10px 18px;border-radius:999px;background:var(--papel);border:1.5px solid var(--linea);font-weight:800;color:var(--tinta)}
.pg-planeacion .ejes .l{background:none;border:none;font-family:var(--mono);font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:var(--suave);padding-left:0}
.pg-planeacion .lineas{display:grid;grid-template-columns:repeat(2,1fr);gap:14px}
.pg-planeacion .linea{background:var(--papel);border:1.5px solid var(--linea);border-radius:18px;padding:26px;display:grid;grid-template-columns:auto 1fr;gap:18px}
.pg-planeacion .linea .n{font-family:var(--display);font-weight:700;font-size:44px;line-height:1;color:var(--c)}
.pg-planeacion .linea h3{font-size:21px;color:var(--tinta);margin-bottom:12px}
.pg-planeacion .linea ol{list-style:none;margin:0;padding:0;display:grid;gap:8px}
.pg-planeacion .linea li{display:grid;grid-template-columns:38px 1fr;font-size:15px;color:var(--suave)}
.pg-planeacion .linea li b{font-family:var(--mono);font-weight:500;font-size:12px;color:var(--c);padding-top:3px}
.pg-planeacion .ruta{position:relative;display:grid;gap:0;padding-left:28px;border-left:2px dashed var(--linea);margin-left:8px}
.pg-planeacion .hito{position:relative;padding:0 0 26px 16px}
.pg-planeacion .hito::before{content:"";position:absolute;left:-38px;top:4px;width:18px;height:18px;border-radius:50%;background:var(--papel);border:4px solid var(--c,var(--azul))}
.pg-planeacion .hito time{font-family:var(--mono);font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--suave)}
.pg-planeacion .hito h3{font-family:var(--cuerpo);font-weight:800;font-size:18px;color:var(--tinta);margin:2px 0 4px}
.pg-planeacion .hito p{margin:0;color:var(--suave);font-size:15px;max-width:70ch}
.pg-planeacion .hito.hoy::before{background:var(--verde);border-color:var(--verde);box-shadow:0 0 0 6px rgba(57,168,53,.2)}
.pg-planeacion .politicas{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;align-items:start}
.pg-planeacion details{background:var(--papel);border:1.5px solid var(--linea);border-radius:14px;padding:16px 18px}
.pg-planeacion details[open]{border-color:var(--azul)}
.pg-planeacion summary{cursor:pointer;font-weight:800;color:var(--tinta);list-style:none;display:flex;gap:12px;align-items:baseline}
.pg-planeacion summary::-webkit-details-marker{display:none}
.pg-planeacion summary b{font-family:var(--mono);font-weight:500;font-size:12px;color:var(--azul)}
.pg-planeacion details p{margin:12px 0 0;font-size:14.5px;color:var(--suave)}
.pg-planeacion .tabla-wrap{overflow-x:auto;background:var(--papel);border:1.5px solid var(--linea);border-radius:18px}
.pg-planeacion table{width:100%;border-collapse:collapse;font-size:15px}
.pg-planeacion th,.pg-planeacion td{text-align:left;padding:12px 18px;border-bottom:1px solid var(--linea);vertical-align:top}
.pg-planeacion th{font-family:var(--mono);font-weight:500;font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--suave);background:var(--fondo)}
.pg-planeacion td.p{font-family:var(--display);font-weight:700;font-size:20px;color:var(--azul);width:70px;font-variant-numeric:tabular-nums}
.pg-planeacion tr:last-child td{border-bottom:none}
.pg-planeacion .chip{display:inline-block;margin-left:8px;font-family:var(--mono);font-size:11px;padding:2px 9px;border-radius:999px;background:#E3F4E2;color:#1F6E1C;white-space:nowrap}
.pg-planeacion footer{background:var(--papel);border-top:1px solid var(--linea)}
.pg-planeacion footer .wrap{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:center;gap:16px;padding-block:28px;font-size:13px;color:var(--suave)}

.pg-experiencias .aliados{display:flex;align-items:center;gap:18px}

.pg-experiencias .mascota{display:block;height:auto;pointer-events:none;filter:drop-shadow(0 10px 18px rgba(0,0,0,.35))}
@media (max-width:640px){.pg-experiencias .aliados img{height:26px}.pg-experiencias footer.inst .grupo img{height:32px}.pg-experiencias footer.inst p{text-align:left}}
.pg-experiencias .stats{display:flex;flex-wrap:wrap;gap:12px;margin-top:22px}
.pg-experiencias .stats div{background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.14);border-radius:14px;padding:12px 18px}
.pg-experiencias .stats b{display:block;font-family:var(--display);font-size:34px;line-height:1;color:var(--amarillo);font-variant-numeric:tabular-nums}
.pg-experiencias .stats span{font-size:13px;color:#C9DCE3}
.pg-experiencias .linea-t{display:grid;gap:0}

/* ===== Texto justificado ===== */
.pg p,.pg li{text-align:justify;text-justify:inter-word;-webkit-hyphens:manual;hyphens:manual;overflow-wrap:normal;word-break:normal}
/* ===== Escuela: memorias por ola ===== */
.pg-escuela .olas2{display:grid;gap:18px}
.pg-escuela .ola2{background:var(--papel);border:1.5px solid var(--linea);border-radius:20px;padding:22px 24px;display:grid;grid-template-columns:170px 1fr;gap:22px;align-items:start}
.pg-escuela .ola2.actual{background:var(--tinta);border-color:var(--tinta);color:#fff}
.pg-escuela .ola2 .anio b{display:block;font-family:var(--display);font-size:46px;line-height:1;color:var(--azul)}
.pg-escuela .ola2.actual .anio b{color:var(--amarillo)}
.pg-escuela .ola2 .anio span{display:block;font-weight:800;margin-top:6px}
.pg-escuela .ola2 .anio small{display:block;color:var(--suave);font-size:13px;margin-top:4px}
.pg-escuela .ola2.actual .anio small{color:#A9C6D1}
.galeria{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.galeria button{all:unset;cursor:zoom-in;display:block;border-radius:12px;overflow:hidden;aspect-ratio:4/3;background:#E1EEF2;position:relative}
.galeria button:focus-visible{outline:3px solid var(--amarillo);outline-offset:2px}
.galeria img{width:100%;height:100%;object-fit:cover;display:block;transition:transform .3s}
.galeria button:hover img{transform:scale(1.05)}
.galeria .vacia{grid-column:1/-1;font-size:14px;color:var(--suave);background:var(--fondo);border:1.5px dashed var(--linea);border-radius:12px;padding:18px;text-align:left}
.ola2.actual .galeria .vacia{background:rgba(255,255,255,.05);border-color:rgba(255,255,255,.2);color:#A9C6D1}
@media (max-width:700px){.pg-escuela .ola2{grid-template-columns:1fr}}
/* ===== Experiencias: fotos ===== */
.pg-experiencias .exp .fotos{display:flex;gap:6px;margin-top:12px;flex-wrap:wrap}
.pg-experiencias .exp .fotos button{all:unset;cursor:zoom-in;width:64px;height:48px;border-radius:8px;overflow:hidden;background:#E1EEF2}
.pg-experiencias .exp .fotos img{width:100%;height:100%;object-fit:cover;display:block}
.pg-experiencias .exp .portada{all:unset;cursor:zoom-in;display:block;margin:-18px -20px 12px;aspect-ratio:16/9;overflow:hidden;background:#E1EEF2}
.pg-experiencias .exp .portada img{width:100%;height:100%;object-fit:cover;display:block}
/* ===== Herramientas: ejemplos ===== */
.pg-herramientas .ejemplos{display:grid;grid-template-columns:repeat(2,1fr);gap:14px}
.pg-herramientas .ejm{background:var(--papel);border:1.5px solid var(--linea);border-radius:20px;padding:20px 22px;display:flex;flex-direction:column;gap:10px}
.pg-herramientas .ejm .n{font-family:var(--mono);font-size:12px;color:var(--suave)}
.pg-herramientas .ejm h3{font-size:20px;color:var(--tinta)}
.pg-herramientas .ejm .caso{font-weight:700;color:var(--azul);margin:0}
.pg-herramientas .ejm svg{width:100%;height:auto;display:block;background:var(--fondo);border-radius:12px}
.pg-herramientas .ejm p{margin:0;font-size:14.5px;color:var(--suave)}
.pg-herramientas .ejm .dato{font-family:var(--mono);font-size:11px;color:#8A6D00;background:#FFF5C2;border-radius:999px;padding:2px 10px;align-self:flex-start}
.pg-herramientas .ejm:last-child:nth-child(odd){grid-column:1/-1}
@media (max-width:820px){.pg-herramientas .ejemplos{grid-template-columns:1fr}}
/* ===== Visor de fotos ===== */
.lb{position:fixed;inset:0;z-index:100;background:rgba(3,34,46,.94);display:flex;flex-direction:column;align-items:center;justify-content:center;padding:24px}
.lb img{max-width:min(1200px,100%);max-height:80vh;border-radius:12px;box-shadow:0 20px 60px rgba(0,0,0,.5)}
.lb p{color:#C9DCE3;margin:14px 0 0;font-size:14px;text-align:center}
.lb-x{position:absolute;top:14px;right:18px;background:none;border:0;color:#fff;font-size:40px;line-height:1;cursor:pointer}

.pg a.ver{display:inline-block;margin-top:10px;font:700 13px 'JetBrains Mono',monospace;color:#006081;border:2px solid #0b1f2a;background:#FFD417;padding:6px 10px;box-shadow:3px 3px 0 #0b1f2a;text-decoration:none}
.pg a.ver:hover{transform:translate(-1px,-1px);box-shadow:4px 4px 0 #0b1f2a}

/* Sin división de palabras con guion en ningún texto */
.pg,.pg *{-webkit-hyphens:manual!important;hyphens:manual!important;word-break:normal}
/* ---------- Rollos de fotos ---------- */
.rollos[hidden]{display:none!important}
.rollos .album{margin-top:26px}.rollos .album h3{font-family:var(--display);font-weight:700;font-size:20px;color:var(--tinta);margin:0}
.rollo{position:relative;margin-top:12px;min-width:0}
.rollo-p{display:flex;gap:12px;overflow-x:auto;scroll-snap-type:x mandatory;padding:4px 2px 10px;scrollbar-width:thin;-webkit-overflow-scrolling:touch}
.rollo-i{flex:0 0 clamp(220px,32%,380px);aspect-ratio:4/3;border:0;padding:0;border-radius:14px;overflow:hidden;background:#E3ECF3;cursor:zoom-in;scroll-snap-align:start}
.rollo-i img{width:100%;height:100%;object-fit:cover;display:block;opacity:0;transition:opacity .4s}
.rollo-i img.ok,.portada img.ok{opacity:1}
.rollo-b{position:absolute;top:calc(50% - 30px);z-index:2;width:40px;height:40px;border-radius:50%;border:0;background:rgba(3,34,46,.8);color:#fff;font-size:24px;line-height:1;cursor:pointer;box-shadow:0 4px 12px rgba(0,0,0,.2)}
.rollo-b.prev{left:-8px}.rollo-b.next{right:-8px}
.rollo-n{display:block;font-size:12px;color:#5B7482;margin-top:2px}
.rollo.mini .rollo-i{flex-basis:clamp(120px,45%,180px)}.rollo.mini .rollo-b{width:32px;height:32px;font-size:20px;top:calc(50% - 26px)}
.galeria-r{min-width:0}
@media(max-width:640px){.rollo-i{flex-basis:82%}.rollo-b{display:none}}

/* Pies de foto y descripción de álbum */
.rollo-i{position:relative}
.rollo-i.con-pie{aspect-ratio:auto;display:flex;flex-direction:column;background:#fff;border:1px solid #DDE7EE;cursor:zoom-in}
.rollo-i.con-pie img{aspect-ratio:4/3;height:auto}
.rollo-c{display:block;padding:12px 14px 14px;font-size:14px;line-height:1.45;color:#34505E;text-align:justify;text-justify:inter-word}
.rollos .album-d{max-width:900px;margin:8px 0 0;color:#4B6573;line-height:1.6;text-align:justify;text-justify:inter-word}
/* Mosaico homenaje (Escuela) */
.homenaje[hidden]{display:none!important}
.homenaje .mosaico{display:grid;grid-template-columns:repeat(6,1fr);grid-template-rows:repeat(3,minmax(120px,auto));gap:12px}
.homenaje .m-foto{grid-column:1/5;grid-row:1/4;border:0;padding:0;border-radius:18px;overflow:hidden;background:#E3ECF3;cursor:zoom-in}
.homenaje .m-foto img{width:100%;height:100%;object-fit:cover;display:block;opacity:0;transition:opacity .5s}
.homenaje .m-foto img.ok{opacity:1}
.homenaje .m-frase{grid-column:5/7;grid-row:1/3;background:var(--tinta);color:#fff;border-radius:18px;padding:26px 24px;display:flex;flex-direction:column;justify-content:center}
.homenaje .m-q{color:var(--amarillo);font-size:1.25em;line-height:0;margin:0 .06em}
.homenaje .m-frase p{margin:6px 0 0;font-family:var(--display);font-weight:600;font-size:clamp(20px,2.1vw,28px);line-height:1.25;text-align:left!important}
.homenaje .m-frase b{color:var(--amarillo)}
.homenaje .m-dedica{grid-column:5/7;grid-row:3/4;background:var(--amarillo);color:var(--tinta);border-radius:18px;padding:18px 22px;display:flex;flex-direction:column;justify-content:center}
.homenaje .m-dedica small{font-size:13px;letter-spacing:.08em;text-transform:uppercase}
.homenaje .m-dedica strong{font-family:var(--display);font-size:clamp(20px,2vw,26px);line-height:1.2}
.homenaje .mosaico{grid-template-rows:repeat(3,minmax(150px,auto))}
@media(max-width:720px){.homenaje .mosaico{grid-template-columns:1fr;grid-template-rows:auto}.homenaje .m-foto,.homenaje .m-frase,.homenaje .m-dedica{grid-column:auto;grid-row:auto}.homenaje .m-foto{aspect-ratio:16/10}}

/* ===== Píldoras Calidosas: slides ===== */
.pslider{position:relative;border-radius:24px;overflow:hidden;background:var(--tinta);color:#fff;box-shadow:0 18px 40px rgba(3,34,46,.18)}
.pslider .pista{display:grid}
.pslide{grid-area:1/1;display:grid;grid-template-columns:clamp(10px,1.4vw,16px) 1fr;min-height:340px;opacity:0;visibility:hidden;transform:translateX(24px);transition:opacity .6s ease,transform .6s ease,visibility 0s linear .6s}
.pslide.on{opacity:1;visibility:visible;transform:none;transition:opacity .6s ease,transform .6s ease,visibility 0s}
.pslide .banda{background:var(--c)}
.pslide .cuerpo{padding:clamp(26px,5vw,56px) clamp(22px,5vw,64px) 88px;display:flex;flex-direction:column;justify-content:center;gap:16px;position:relative}
.pslide .num{font-family:var(--mono);font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:color-mix(in srgb,var(--c) 55%,#fff)}
