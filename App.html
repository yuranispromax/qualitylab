<script>
(function () {
  var SITIO = 'https://sites.google.com/miredips.org/qualitylab';
  var COL = { azul: 'var(--azul)', verde: 'var(--verde)', naranja: 'var(--naranja)', amarillo: '#E0B400', violeta: 'var(--violeta)' };
  var MES = ['ene','feb','mar','abr','may','jun','jul','ago','sep','oct','nov','dic'];
  var D = DATOS || {};
  function $(id) { return document.getElementById(id); }
  function esc(s) { return String(s == null ? '' : s).replace(/[&<>"]/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]; }); }
  function fecha(f) { return new Date(String(f).slice(0, 10) + 'T00:00:00'); }
  var hoy = new Date(); hoy.setHours(0, 0, 0, 0);

  /* ---------- Navegación ---------- */
  var actual = null;
  function mostrar(s, destino) {
    var pgs = document.querySelectorAll('.pg');
    for (var i = 0; i < pgs.length; i++) pgs[i].hidden = pgs[i].getAttribute('data-sec') !== s;
    var links = document.querySelectorAll('.topnav a[data-s]');
    for (var j = 0; j < links.length; j++) links[j].classList.toggle('act', links[j].getAttribute('data-s') === s);
    actual = s;
    if (typeof reactivarPildoras === 'function') reactivarPildoras();
    if (destino && $(destino)) { $(destino).scrollIntoView({ behavior: 'smooth' }); } else { window.scrollTo(0, 0); }
    if (s === 'inicio') burbujas();
  }
  document.addEventListener('click', function (e) {
    var a = e.target.closest('[data-s]');
    if (a) { e.preventDefault(); mostrar(a.getAttribute('data-s'), a.getAttribute('data-ir')); return; }
    var sc = e.target.closest('[data-scroll]');
    if (sc) { e.preventDefault(); var t = $(sc.getAttribute('data-scroll')); if (t) t.scrollIntoView({ behavior: 'smooth' }); }
  });

  /* ---------- Inicio: tabla periódica ---------- */
  var ELEMENTOS = [
    { s: 'planeacion', sim: 'Pe', n: 'Planeación Estratégica', d: 'Propósito, misión, visión, megas y valores del PL-DIE-001.', c: 'var(--amarillo)', f: 'Estrategia', dest: true },
    { s: 'biblioteca', sim: 'Bi', n: 'Biblioteca', d: 'Normas, documentos y guías del sistema de gestión.', c: 'var(--azul)', f: 'Conocimiento' },
    { s: 'herramientas', sim: 'He', n: 'Herramientas', d: 'Tableros y aplicaciones que miden y controlan.', c: 'var(--verde)', f: 'Gestión' },
    { s: 'biblioteca', ir: 'almera', sim: 'Re', n: 'Recursos', d: 'Materiales útiles y prácticas seguras para tu trabajo.', c: 'var(--azul)', f: 'Conocimiento' },
    { scroll: 'calendario', sim: 'Ca', n: 'Calendario CALIDOSO', d: 'Fechas clave de formación, auditoría y eventos.', c: 'var(--verde)', f: 'Gestión' },
    { s: 'escuela', sim: 'Ec', n: 'Escuela de Calidad', d: 'Olas de formación Lean Six Sigma e INFLUEN[Ser].', c: '#E0B400', f: 'Personas' },
    { url: SITIO + '/formularios-y-encuestas', sim: 'Fe', n: 'Formularios y Encuestas', d: 'La voz de los equipos y los usuarios.', c: '#E0B400', f: 'Personas' },
    { s: 'experiencias', sim: 'Ex', n: 'Experiencias Exitosas', d: 'Concursos, simposios y foros donde MiRed se destaca.', c: 'var(--naranja)', f: 'Resultados' },
    { url: SITIO + '/reconocimientos-institucionales', sim: 'Rc', n: 'Reconocimientos Institucionales', d: 'Logros y certificaciones de la institución.', c: 'var(--naranja)', f: 'Resultados' }
  ];
  var tabla = $('tabla');
  if (tabla) tabla.innerHTML = ELEMENTOS.map(function (e, i) {
    var attrs = e.url ? 'href="' + e.url + '" target="_blank" rel="noopener"' : e.scroll ? 'href="#" data-scroll="' + e.scroll + '"' : 'href="#" data-s="' + e.s + '"' + (e.ir ? ' data-ir="' + e.ir + '"' : '');
    return '<a class="el' + (e.dest ? ' destacado' : '') + '" style="--c:' + e.c + '" ' + attrs + '><span class="num"><span>' + String(i + 1).padStart(2, '0') + '</span><span>' + e.f + '</span></span><span class="sim">' + e.sim + '</span><span class="nom">' + e.n + '</span><span class="des">' + e.d + '</span></a>';
  }).join('');

  /* ---------- Inicio: Calendario CALIDOSO ---------- */
  var cal = $('cal');
  if (cal) {
    var prox = (D.calendario || []).filter(function (e) { return e.Fecha && fecha(e.Fecha) >= hoy; })
      .sort(function (a, b) { return fecha(a.Fecha) - fecha(b.Fecha); }).slice(0, 8);
    cal.innerHTML = prox.map(function (e, i) {
      var d = fecha(e.Fecha); var t = String(e.Evento).split(' · ');
      return '<div class="dia' + (i === 0 ? ' proximo' : '') + '"><div class="fecha"><b>' + d.getDate() + '</b><small>' + MES[d.getMonth()] + '</small></div><div><h3>' + esc(t.length > 1 ? t.slice(1).join(' · ') : t[0]) + '</h3><span class="tag">' + esc(e.Tipo) + '</span></div></div>';
    }).join('');
    var nota = $('cal-nota');
    if (nota) nota.textContent = prox.length ? (prox[0].Tipo + ' · ' + (prox[0].Lugar || '')) : 'No hay eventos programados. Pronto se publican nuevas fechas.';
  }

  /* ---------- Noticias ---------- */
  var bit = $('bit');
  if (bit) bit.innerHTML = (D.noticias || []).map(function (n) {
    return '<article class="entrada" style="--c:' + (COL[n.Color] || COL.azul) + '"><span class="eyebrow">' + esc(n.Etiqueta) + '</span><h3>' + esc(n.Titulo) + '</h3><p>' + esc(n.Texto) + '</p></article>';
  }).join('');

  /* ---------- Fórmula del Mes ---------- */
  var fm = $('formula-mes');
  if (fm) {
    var activas = (D.formula || []).filter(function (p) { return p.Nombre && String(p.Activa || 'Sí').toLowerCase().charAt(0) !== 'n'; });
    var f = activas[activas.length - 1];
    if (f) {
      var cual = String(f.Cualidades || '').split(',').map(function (c) { return c.trim(); }).filter(Boolean);
      var ec = cual.map(function (c, i) { return '<li class="fe-term">' + esc(c) + '</li>' + (i < cual.length - 1 ? '<li class="fe-op" aria-hidden="true">+</li>' : ''); }).join('') + '<li class="fe-op" aria-hidden="true">=</li>' + (f.Resultado ? '<li class="fe-res">' + esc(f.Resultado) + '</li>' : '');
      var foto = f.Foto && (window.IMG || {})[f.Foto];
      fm.innerHTML = '<div class="wrap"><div class="cab"><div><span class="eyebrow">Fórmula del Mes · ' + esc(f.Mes) + '</span><h2 id="t-formula">Las personas detrás de la calidad</h2></div><p>Cada mes reconocemos a alguien de MiRed cuyas cualidades suman a nuestra cultura de mejora continua.</p></div>' +
        '<article class="formula-card"><div class="formula-foto">' + (foto ? '<img src="' + foto + '" alt="' + esc(f.Nombre) + '">' : '<span class="formula-in" aria-hidden="true">' + esc((f.Nombre || '').trim().split(/\s+/).slice(0, 2).map(function (w) { return w[0]; }).join('')) + '</span>') + '</div>' +
        '<div class="formula-cont"><ul class="formula-ec">' + ec + '</ul><h3 class="formula-nombre">' + esc(f.Nombre) + '</h3><p class="formula-cargo">' + esc(f.Cargo) + '</p>' + (f.Descripcion ? '<p class="formula-desc">' + esc(f.Descripcion) + '</p>' : '') + '</div></article></div>';
      fm.hidden = false;
    }
  }

  /* ---------- Instrumentos (Inicio y Herramientas) ---------- */
  function instrumentos(id) {
    var box = $(id); if (!box) return;
    box.innerHTML = (D.herramientas || []).map(function (h) {
      var u = String(h.URL || '').trim();
      var tag = u ? 'a' : 'div';
      return '<' + tag + ' class="inst"' + (u ? ' href="' + esc(u) + '" target="_blank" rel="noopener"' : '') + '><span><b>' + esc(h.Nombre) + '</b><small>' + esc(h.Descripcion) + '</small></span><span class="estado pill ' + (u ? 'on ok' : 'off') + '">' + (u ? 'Abrir' : 'Por conectar') + '</span></' + tag + '>';
    }).join('');
  }
  instrumentos('inst'); instrumentos('inst2');

  /* ---------- Biblioteca ---------- */
  var est = $('est');
  if (est) est.innerHTML = (D.areas || []).map(function (a, i) {
    var mats = (D.biblioteca || []).filter(function (m) { return m.Area === a.Area && m.Material; });
    var lis = mats.map(function (m) {
      return '<li><a href="' + esc(m.URL) + '" target="_blank" rel="noopener"><span>' + esc(m.Material) + '</span><em>Abrir en Drive ↗</em></a></li>';
    }).join('');
    var st = mats.length ? '<span class="pill ok">' + mats.length + ' materiales</span>' : '<span class="pill pronto">En construcción</span>';
    return '<article class="estante" style="--c:' + (COL[a.Color] || COL.azul) + '"><div class="lomo"><span>' + String(i + 1).padStart(2, '0') + '</span></div><div class="cont"><h3>' + esc(a.Area) + '</h3>' + (lis ? '<ul>' + lis + '</ul>' : '') + (a.Texto ? '<p>' + esc(a.Texto) + '</p>' : '') + st + '</div></article>';
  }).join('');
  var alm = $('almera');
  if (alm) { var h0 = (D.herramientas || []).filter(function (h) { return h.Nombre === 'ALMERA'; })[0]; alm.href = (h0 && h0.URL) || 'https://sgi.almeraim.com/sgi/?conid=sgimiredips'; alm.classList.remove('off'); alm.textContent = 'Ingresar a ALMERA'; }

  /* ---------- Escuela de Calidad ---------- */
  var ol = $('mods');
  if (ol) {
    var mods = (D.calendario || []).filter(function (e) { return e.Tipo === 'Escuela de Calidad'; }).sort(function (a, b) { return fecha(a.Fecha) - fecha(b.Fecha); });
    var hechos = 0, px = -1;
    ol.innerHTML = mods.map(function (m, i) {
      var d = fecha(m.Fecha), done = d < hoy; if (done) hechos++; else if (px < 0) px = i;
      var t = String(m.Evento).split(' · ');
      return '<li class="' + (done ? 'hecho' : (px === i ? 'proximo' : '')) + '"><div class="f"><b>' + d.getDate() + '</b><small>' + MES[d.getMonth()] + '</small></div><div><span class="m">' + esc(t.length > 1 ? t[0] : '') + '</span><h3>' + esc(t.length > 1 ? t.slice(1).join(' · ') : t[0]) + '</h3></div><span class="est">' + (done ? 'Realizado' : (px === i ? 'Próxima clase' : 'Programado')) + '</span></li>';
    }).join('');
    var pct = mods.length ? Math.round(hechos / mods.length * 100) : 0;
    if ($('pct')) $('pct').textContent = pct + '%';
    if ($('barra')) setTimeout(function () { $('barra').style.width = pct + '%'; }, 200);
    if ($('hechos')) $('hechos').textContent = hechos + ' de ' + mods.length + ' sesiones realizadas';
  }

  /* ---------- Experiencias ---------- */
  var ex = $('exp');
  if (ex) {
    var xs = D.experiencias || [], porAnio = {};
    xs.forEach(function (x) { (porAnio[x['Año']] = porAnio[x['Año']] || []).push(x); });
    var anios = Object.keys(porAnio).sort(function (a, b) { return b - a; });
    ex.innerHTML = anios.map(function (y) {
      var l = porAnio[y];
      return '<div class="anio"><div class="marca"><b>' + y + '</b><span>' + l.length + (l.length === 1 ? ' experiencia' : ' experiencias') + '</span></div><div class="fichas">' + l.map(function (x) {
        var c = /OES/i.test(x.Escenario) ? 'var(--naranja)' : /IHI/i.test(x.Escenario) ? 'var(--verde)' : 'var(--azul)';
        var fx = ((D.fotos || {}).experiencias || {})[x['Año'] + ' · ' + x.Titulo] || [];
        var cap = esc(x['Año'] + ' · ' + x.Titulo);
        var portada = fx.length ? '<button type="button" class="portada" data-foto="' + fx[0].id + '" data-cap="' + cap + '"><img data-fid="' + fx[0].id + '" alt="' + cap + '"></button>' : '';
        var mas = fx.length > 1 ? rollo(fx.slice(1), x['Año'] + ' · ' + x.Titulo, 'mini') : '';
        var ver = (x.Enlace && fx.length) ? '<a class="ver" href="' + esc(x.Enlace) + '" target="_blank" rel="noopener">Ver presentación →</a>' : '';
        var inner = portada + '<span class="org">' + esc(String(x.Escenario).toUpperCase()) + '</span><h3>' + esc(x.Titulo) + '</h3><p>' + esc(x.Lugar || 'MiRed IPS') + '</p>' + mas + ver;
        return (x.Enlace && !fx.length) ? '<a class="exp" style="--c:' + c + ';text-decoration:none;color:inherit;display:block" href="' + esc(x.Enlace) + '" target="_blank" rel="noopener">' + inner + '</a>' : '<article class="exp" style="--c:' + c + '">' + inner + '</article>';
      }).join('') + '</div></div>';
    }).join('');
    var st2 = $('expstats');
    if (st2 && xs.length) {
      var oes = xs.filter(function (x) { return /OES/i.test(x.Escenario); }).length;
      st2.innerHTML = '<div><b>' + xs.length + '</b><span>experiencias presentadas</span></div><div><b>' + anios.length + '</b><span>años con participación, ' + anios[anios.length - 1] + '–' + anios[0] + '</span></div><div><b>' + oes + '</b><span>en el Foro OES de Cartagena</span></div>';
    }
  }

  /* ---------- Burbujas del hero ---------- */
  var burbujasOn = false;
  function burbujas() {
    if (burbujasOn) return;
    var cv = $('burbujas');
    if (!cv || matchMedia('(prefers-reduced-motion: reduce)').matches) return;
    burbujasOn = true;
    var ctx = cv.getContext('2d'), W, H, B = [], dpr = Math.min(window.devicePixelRatio || 1, 2);
    function rs() { W = cv.clientWidth; H = cv.clientHeight; cv.width = W * dpr; cv.height = H * dpr; ctx.setTransform(dpr, 0, 0, dpr, 0, 0); }
    function nueva(y) { return { x: Math.random() * W, y: y == null ? H + 20 : y, r: 2 + Math.random() * 9, v: .25 + Math.random() * .7, o: Math.random() * 6.28, g: Math.random() < .35 }; }
    rs(); for (var i = 0; i < 46; i++) B.push(nueva(Math.random() * H));
    window.addEventListener('resize', rs);
    (function loop() {
      if (actual === 'inicio') {
        if (!W) rs();
        ctx.clearRect(0, 0, W, H);
        B.forEach(function (b, i) {
          b.y -= b.v; b.o += .02; var x = b.x + Math.sin(b.o) * 8;
          ctx.beginPath(); ctx.arc(x, b.y, b.r, 0, 6.283);
          ctx.fillStyle = b.g ? 'rgba(57,168,53,.22)' : 'rgba(255,255,255,.07)'; ctx.fill();
          ctx.strokeStyle = b.g ? 'rgba(120,220,110,.35)' : 'rgba(255,255,255,.14)'; ctx.lineWidth = 1; ctx.stroke();
          if (b.y < -20) B[i] = nueva();
        });
      }
      requestAnimationFrame(loop);
    })();
  }

  /* ---------- Herramientas: ejemplos didácticos ---------- */
  var AZ = '#006081', VE = '#39A835', NA = '#FF7A3D', AM = '#E0B400', TI = '#03222E', SU = '#4F6B76', LI = '#C9D8DE';
  function svg(inner, h) { return '<svg viewBox="0 0 400 ' + (h || 230) + '" role="img" font-family="Nunito Sans, system-ui, sans-serif">' + inner + '</svg>'; }
  function tx(x, y, t, o) { o = o || {}; return '<text x="' + x + '" y="' + y + '" font-size="' + (o.s || 11) + '" fill="' + (o.c || TI) + '" text-anchor="' + (o.a || 'start') + '" font-weight="' + (o.w || 600) + '">' + t + '</text>'; }
  function ishikawa() {
    var g = '<line x1="20" y1="115" x2="300" y2="115" stroke="' + AZ + '" stroke-width="4"/><polygon points="300,105 318,115 300,125" fill="' + AZ + '"/>';
    g += '<rect x="320" y="88" width="74" height="54" rx="8" fill="' + NA + '"/>' + tx(357, 110, 'Demora en', { a: 'middle', c: '#fff', s: 10.5 }) + tx(357, 124, 'urgencias', { a: 'middle', c: '#fff', s: 10.5 });
    var cat = [['Personal', 'Turnos rotativos', 30, 1], ['Métodos', 'Triage variable', 132, 1], ['Máquinas', 'Sistema lento', 230, 1], ['Materiales', 'Insumos agotados', 30, -1], ['Medición', 'Sin registro', 132, -1], ['Entorno', 'Sala saturada', 230, -1]];
    cat.forEach(function (c) {
      var arriba = c[3] > 0;
      g += '<line x1="' + c[2] + '" y1="' + (arriba ? 42 : 188) + '" x2="' + (c[2] + 40) + '" y2="115" stroke="' + SU + '" stroke-width="2"/>';
      g += tx(c[2] - 8, arriba ? 20 : 212, c[0], { w: 800, c: AZ, s: 10.5 });
      g += tx(c[2] - 8, arriba ? 33 : 225, c[1], { s: 9, c: SU, w: 600 });
    });
    return svg(g, 232);
  }
  function hoja() {
    var d = [['Mañana', '||||  |', 6], ['Tarde', '||||', 4], ['Noche', '||||  ||||  |', 11]];
    var g = tx(20, 26, 'Caídas de pacientes registradas · una semana', { w: 800, s: 12 });
    g += '<rect x="20" y="40" width="360" height="30" fill="' + AZ + '" rx="6"/>' + tx(34, 60, 'Turno', { c: '#fff', w: 800 }) + tx(140, 60, 'Conteo', { c: '#fff', w: 800 }) + tx(366, 60, 'Total', { c: '#fff', w: 800, a: 'end' });
    d.forEach(function (r, i) {
      var y = 70 + i * 44;
      g += '<rect x="20" y="' + y + '" width="360" height="44" fill="' + (i % 2 ? '#fff' : '#EAF2F5') + '"/>';
      g += tx(34, y + 27, r[0], { s: 12 }) + tx(140, y + 28, r[1], { s: 16, c: VE, w: 800 }) + tx(366, y + 28, r[2], { s: 14, w: 800, a: 'end' });
    });
    g += tx(20, 222, 'El turno de la noche concentra la mayoría de los casos.', { s: 10.5, c: SU });
    return svg(g);
  }
  function control() {
    var v = [21, 24, 19, 23, 22, 26, 20, 23, 33, 22, 21, 24, 19, 22, 23];
    var x0 = 72, x1 = 390, y = function (m) { return 195 - (m - 10) * 6.5; };
    var g = tx(40, 18, 'Minutos de espera para triage · 15 días', { w: 800, s: 12 });
    [['LCS 30', 30, NA], ['Media 22', 22, VE], ['LCI 14', 14, NA]].forEach(function (l) {
      g += '<line x1="' + x0 + '" y1="' + y(l[1]) + '" x2="' + x1 + '" y2="' + y(l[1]) + '" stroke="' + l[2] + '" stroke-width="1.5" stroke-dasharray="' + (l[1] === 22 ? '0' : '5 4') + '"/>' + tx(x0 - 4, y(l[1]) + 4, l[0], { s: 9, a: 'end', c: l[2] });
    });
    var pts = v.map(function (m, i) { return (x0 + 10 + i * 21) + ',' + y(m); });
    g += '<polyline points="' + pts.join(' ') + '" fill="none" stroke="' + AZ + '" stroke-width="2"/>';
    v.forEach(function (m, i) { var fuera = m > 30; g += '<circle cx="' + (x0 + 10 + i * 21) + '" cy="' + y(m) + '" r="' + (fuera ? 6 : 3.5) + '" fill="' + (fuera ? NA : AZ) + '"/>'; });
    g += tx(x0 + 10 + 8 * 21, y(33) - 10, 'Fuera de control', { s: 9.5, c: NA, a: 'middle', w: 800 });
    return svg(g, 215);
  }
  function flujo() {
    function caja(x, y, w, t, c, r) { return '<rect x="' + x + '" y="' + y + '" width="' + w + '" height="30" rx="' + (r || 8) + '" fill="' + c + '"/>' + tx(x + w / 2, y + 19, t, { a: 'middle', c: '#fff', s: 10.5 }); }
    function fl(x1, y1, x2, y2) { return '<line x1="' + x1 + '" y1="' + y1 + '" x2="' + x2 + '" y2="' + y2 + '" stroke="' + SU + '" stroke-width="1.8" marker-end="url(#fx)"/>'; }
    var g = '<defs><marker id="fx" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="' + SU + '"/></marker></defs>';
    g += caja(8, 14, 128, 'Llegada del usuario', VE, 15) + fl(136, 29, 164, 29) + caja(166, 14, 76, 'Triage', AZ);
    g += fl(242, 29, 268, 29) + '<polygon points="320,4 372,29 320,54 268,29" fill="' + AM + '"/>' + tx(320, 27, '¿Prioridad', { a: 'middle', s: 9.5 }) + tx(320, 39, 'I o II?', { a: 'middle', s: 9.5 });
    g += fl(320, 54, 320, 92) + tx(326, 76, 'Sí', { s: 10, c: VE, w: 800 }) + caja(262, 94, 116, 'Atención inmediata', NA);
    g += fl(268, 29, 268, 29) + '<path d="M300,44 L200,92" stroke="' + SU + '" stroke-width="1.8" fill="none" marker-end="url(#fx)"/>' + tx(232, 66, 'No', { s: 10, c: NA, w: 800 }) + caja(120, 94, 110, 'Sala de espera', AZ);
    g += fl(175, 124, 175, 150) + caja(110, 152, 130, 'Consulta médica', AZ) + fl(320, 124, 240, 160);
    g += fl(175, 182, 175, 196) + caja(125, 198, 100, 'Egreso', VE, 15);
    return svg(g, 235);
  }
  function histograma() {
    var b = [['0-10', 4], ['10-20', 12], ['20-30', 18], ['30-40', 9], ['40-50', 4], ['50-60', 2]];
    var g = tx(40, 18, 'Tiempo de espera en consulta externa · 49 usuarios', { w: 800, s: 12 });
    g += '<line x1="40" y1="190" x2="390" y2="190" stroke="' + LI + '"/>';
    b.forEach(function (r, i) {
      var h = r[1] * 8, x = 45 + i * 57;
      g += '<rect x="' + x + '" y="' + (190 - h) + '" width="55" height="' + h + '" fill="' + (i === 2 ? VE : AZ) + '"/>' + tx(x + 27, 185 - h, r[1], { a: 'middle', s: 10, w: 800 }) + tx(x + 27, 204, r[0], { a: 'middle', s: 9.5, c: SU });
    });
    g += tx(215, 222, 'minutos', { a: 'middle', s: 10, c: SU });
    return svg(g);
  }
  function pareto() {
    var d = [['Oportunidad de citas', 42], ['Trato del personal', 21], ['Trámites', 14], ['Infraestructura', 9], ['Otros', 6]];
    var tot = 92, acc = 0, x0 = 40, g = tx(40, 18, 'Causas de PQRS en un trimestre · 92 casos', { w: 800, s: 12 });
    var yb = function (v) { return 180 - v * 3.3; }, yp = function (p) { return 180 - p * 1.45; };
    g += '<line x1="' + x0 + '" y1="' + yp(80) + '" x2="390" y2="' + yp(80) + '" stroke="' + NA + '" stroke-dasharray="4 4"/>' + tx(390, yp(80) - 4, '80 %', { a: 'end', s: 9.5, c: NA, w: 800 });
    var pts = [];
    d.forEach(function (r, i) {
